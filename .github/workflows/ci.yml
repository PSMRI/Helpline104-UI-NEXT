name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Common-UI submodule)
        uses: actions/checkout@v4
        with:
          # Common-UI submodule is required to build.
          submodules: recursive
          # No later step needs the token; don't leave it in git config where
          # repository-controlled npm/build scripts could read it.
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build (CI env injection + production)
        # Runs the same prebuild script the deploy pipeline uses: it renders
        # environment.ci.ts from environment.ci.ts.template via process.env
        # (empty-string defaults here, since no real secrets are set on PR
        # builds), then builds with the ci environment layered on production.
        run: npm run build-ci

      # The lint script lands in a separate open PR; --if-present keeps
      # CI green on branches cut before it merges.
      - name: Lint
        run: npm run lint --if-present
